plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.ladysnake.org/releases" }
    maven { url "https://jitpack.io" }
	maven { url "https://maven.nucleoid.xyz/"}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LevelZ
    implementation ("maven.modrinth:levelz:${project.levelz_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // LibZ
    api ("maven.modrinth:libz:${project.libz_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Cloth
    implementation ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu
    compileOnly localRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
	// Numismatic
	compileOnly ('maven.modrinth:numismatic-overhaul:0.3.4+1.21') {
		transitive = false
	}
	compileOnly ("org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.2") {
		transitive = false
	}
	compileOnly ("org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.2") {
		transitive = false
	}
	// FallingTree
	compileOnly ("maven.modrinth:fallingtree:${project.fallingtree_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

sourceSets {
	main {
		java {
			exclude 'net/jobsaddon/compat/TreeChopCompat.java'
			exclude 'net/jobsaddon/compat/CupellationCompat.java'
			exclude 'net/jobsaddon/mixin/compat/TideFishingHookMixin.java'
			exclude 'net/jobsaddon/mixin/compat/FallingTreeEntityMixin.java'
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
